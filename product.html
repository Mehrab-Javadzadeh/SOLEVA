<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Soleva | Product</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Top navigation bar -->
    <div class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>
        <div class="nav-center">
            <img src="images/logo.png.jpg" class="logo" alt="Soleva Logo" id="themeToggle">
        </div>
        <div class="nav-right">
            <i class="fas fa-user" id="userIcon"></i>
            <i class="fas fa-shopping-bag" id="cartIcon"></i>
            <i class="fas fa-bars" id="menuIcon"></i>
        </div>
    </div>

    <!-- Sidebar menu -->
    <div id="sideMenu" class="side-menu">
        <div class="side-menu-header">
            <h2>Soleva</h2>
            <i class="fas fa-times" id="closeMenu"></i>
        </div>
        <div class="side-menu-body">
            <div id="menuUserStatus" class="menu-user-status">
                <i class="fas fa-user-circle" id="menuUserIcon"></i>
                <div>
                    <div id="menuUserName">Guest</div>
                    <div id="menuUserEmail" class="menu-user-email">Not logged in</div>
                </div>
            </div>
            <hr>
            <div class="menu-items">
                <a href="index.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                <a href="#" class="menu-item" id="menuAuthAction" onclick="openAuthFromMenu()">
                    <i class="fas fa-sign-in-alt"></i> <span id="menuAuthText">Login / Register</span>
                </a>
                <a href="#" class="menu-item hidden" onclick="logoutFromMenu()" id="menuLogoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
                <a href="#" class="menu-item" onclick="openCartFromMenu()">
                    <i class="fas fa-shopping-bag"></i> My Orders
                </a>
            </div>
        </div>
    </div>

    <!-- Product details -->
    <div id="productContainer" class="product-container">
        <div class="loading-container">
            <i class="fas fa-spinner fa-pulse loading-spinner"></i>
            <p class="loading-text">Loading product...</p>
        </div>
    </div>

    <!-- Shopping panel -->
    <div id="cartPage" class="cart-page">
        <div class="cart-header">
            <i class="fas fa-arrow-right" id="closeCart"></i>
            <h2><i class="fas fa-shopping-bag"></i> Shopping Cart</h2>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">Total: <span id="cartTotal">0</span> T</div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <!-- Checkout modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeCheckout">&times;</span>
            <div class="auth-form">
                <h2>Complete Order</h2>
                <div id="checkoutError" class="error-msg"></div>
                <input type="tel" id="checkoutPhone" placeholder="Phone number (e.g. 09121234567)" maxlength="11">
                <textarea id="checkoutAddress" placeholder="Full delivery address (Province, City, Street, No.)" rows="4"></textarea>
                <div id="checkoutSummary" class="checkout-summary"></div>
                <button onclick="submitOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <!-- Authentication modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeAuth">&times;</span>

            <div id="registerForm" class="auth-form">
                <h2>Create Account</h2>
                <div id="registerError" class="error-msg"></div>
                <input type="email" id="regEmail" placeholder="Your Email">
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="regPassword"
                        class="password-input"
                        placeholder="Password (Min 6 characters)">
                    <i class="fas fa-eye password-toggle"
                        id="toggleRegPassword"></i>
                </div>
                <button onclick="registerUser()">Register</button>
                <p class="switch-form">Already have an account? <span onclick="toggleAuth('login')">Login</span></p>
            </div>

            <div id="loginForm" class="auth-form hidden">
                <h2>Login</h2>
                <div id="loginError" class="error-msg"></div>
                <input type="email" id="logEmail" placeholder="Your Email">
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="logPassword"
                        class="password-input"
                        placeholder="Password">
                    <i
                        class="fas fa-eye password-toggle"
                        id="toggleLogPassword"></i>
                    </div>
                <button onclick="loginUser()">Login</button>
                <p class="switch-form">Don't have an account? <span onclick="toggleAuth('register')">Register</span></p>
            </div>

            <div id="profileView" class="auth-form hidden">
                <h2>Welcome!</h2>
                <p id="userEmailDisplay"></p>
                <button onclick="logoutUser()" class="logout-btn">Logout</button>
            </div>
        </div>
    </div>

</body>
</html>
